name: Deploy GNAF to Cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (leave empty for latest)'
        required: false
        default: ''

# Read-only by default; the deploy job needs write access to commit wrangler.json
permissions:
  contents: read

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # download the release, commit wrangler.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]{8}(-[a-z0-9]+)+$ ]]; then
            echo "::error::Unexpected release tag: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "$VERSION" \
            --pattern "gnaf-shards-*.tar" \
            --dir data/

      - name: Extract shards
        run: |
          mkdir -p data/shards
          tar -xf data/gnaf-shards-*.tar -C data/shards

      - name: Upload to R2
        run: npm run pipeline:upload
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      - name: Create new D1 database
        id: d1
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_NAME="gnaf-search-${VERSION}"
          OUTPUT=$(npx wrangler d1 create "$DB_NAME" --location=oc 2>&1)
          echo "$OUTPUT"
          DB_ID=$(echo "$OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$DB_ID" ]; then
            echo "::error::Failed to parse database_id from wrangler output"
            exit 1
          fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "db_name=$DB_NAME" >> "$GITHUB_OUTPUT"
          echo "Created D1 database: $DB_NAME ($DB_ID)"

      - name: Import search index to D1
        env:
          DB_NAME: ${{ steps.d1.outputs.db_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in data/shards/search-index/*.sql; do
            echo "Executing $f..."
            npx wrangler d1 execute "$DB_NAME" --remote --file="$f"
          done

      - name: Enable D1 read replication
        env:
          DB_ID: ${{ steps.d1.outputs.db_id }}
          DB_NAME: ${{ steps.d1.outputs.db_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sf -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"read_replication":{"mode":"auto"}}'
          echo "Read replication enabled for ${DB_NAME}"

      - name: Update wrangler.json with new D1 database and GNAF version
        env:
          DB_ID: ${{ steps.d1.outputs.db_id }}
          DB_NAME: ${{ steps.d1.outputs.db_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg id "$DB_ID" \
             --arg name "$DB_NAME" \
             --arg version "$VERSION" \
             '.d1_databases[0].database_id = $id | .d1_databases[0].database_name = $name | .vars.GNAF_VERSION = $version' \
             wrangler.json > wrangler.json.tmp && mv wrangler.json.tmp wrangler.json

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Deploy must run on a branch to commit wrangler.json (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrangler.json
          git commit -m "chore: deploy GNAF ${VERSION}"
          # Credentials are only used for these two commands (checkout doesn't persist them)
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$REMOTE" "$GITHUB_REF_NAME"
          git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}"
